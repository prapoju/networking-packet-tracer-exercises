<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Comic Sans MS, Comic Neue, Chalkboard SE, cursive" stroke-linejoin="round" stroke-linecap="round">
  <!-- sky and sun -->
  <rect width="600" height="400" fill="#4cc9f0"/>
  <circle cx="70" cy="60" r="30" fill="#ffd60a" stroke="#000" stroke-width="4"/>

  <!-- sea -->
  <rect x="0" y="250" width="600" height="90" fill="#0077b6" stroke="#000" stroke-width="4"/>
  <g stroke="#90e0ef" stroke-width="3" fill="none">
    <path d="M30 280 Q45 272 60 280"/><path d="M420 300 Q435 292 450 300"/><path d="M500 270 Q515 262 530 270"/>
  </g>

  <!-- boardwalk -->
  <rect x="0" y="335" width="600" height="65" fill="#ffb703" stroke="#000" stroke-width="4"/>
  <g stroke="#000" stroke-width="2">
    <line x1="60" y1="335" x2="60" y2="400"/><line x1="140" y1="335" x2="140" y2="400"/><line x1="220" y1="335" x2="220" y2="400"/><line x1="300" y1="335" x2="300" y2="400"/><line x1="380" y1="335" x2="380" y2="400"/><line x1="460" y1="335" x2="460" y2="400"/><line x1="540" y1="335" x2="540" y2="400"/>
  </g>

  <!-- speech bubble -->
  <g stroke="#000" stroke-width="4">
    <rect x="250" y="40" width="270" height="120" rx="24" fill="#fff"/>
    <path d="M252 92 L226 138 L252 124" fill="#fff"/>
  </g>
  <rect x="246" y="94" width="10" height="28" fill="#fff"/>
  <text x="385" y="82" font-size="22" font-weight="bold" fill="#f77f00" text-anchor="middle">Hi, I'm Jax!</text>
  <text x="385" y="112" font-size="18" fill="#000" text-anchor="middle">You're going to</text>
  <text x="385" y="138" font-size="18" fill="#000" text-anchor="middle">help me.</text>

  <!-- Jax -->
  <g stroke="#000" stroke-width="4">
    <!-- legs and shoes -->
    <rect x="176" y="300" width="22" height="55" fill="#1d4ed8"/>
    <rect x="204" y="300" width="22" height="55" fill="#1d4ed8"/>
    <ellipse cx="184" cy="360" rx="18" ry="9" fill="#fff"/>
    <ellipse cx="220" cy="360" rx="18" ry="9" fill="#fff"/>
    <!-- left arm down -->
    <rect x="148" y="215" width="22" height="75" rx="10" fill="#f77f00"/>
    <circle cx="159" cy="295" r="10" fill="#c68642"/>
    <!-- right arm waving -->
    <rect x="236" y="150" width="22" height="75" rx="10" fill="#f77f00" transform="rotate(25 247 220)"/>
    <circle cx="272" cy="150" r="11" fill="#c68642"/>
    <!-- hoodie -->
    <rect x="164" y="205" width="74" height="100" rx="14" fill="#f77f00"/>
    <rect x="178" y="262" width="46" height="26" rx="6" fill="#e36414"/>
    <!-- neck and head -->
    <rect x="192" y="190" width="18" height="18" fill="#c68642"/>
    <circle cx="201" cy="160" r="34" fill="#c68642"/>
    <!-- messy hair -->
    <path d="M167 155 Q165 120 201 122 Q240 120 236 155 Q228 138 218 146 Q210 132 198 144 Q186 132 178 148 Z" fill="#2b2118"/>
  </g>
  <!-- face -->
  <circle cx="190" cy="162" r="4" fill="#000"/>
  <circle cx="213" cy="162" r="4" fill="#000"/>
  <path d="M188 178 Q201 190 214 178" fill="none" stroke="#000" stroke-width="3"/>
</svg>
