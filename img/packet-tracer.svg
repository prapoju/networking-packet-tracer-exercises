<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Comic Sans MS, Comic Neue, Chalkboard SE, cursive" stroke-linejoin="round" stroke-linecap="round">
  <!-- wall and floor -->
  <rect width="600" height="400" fill="#b5179e"/>
  <rect x="0" y="330" width="600" height="70" fill="#ffd60a" stroke="#000" stroke-width="4"/>

  <!-- window -->
  <g stroke="#000" stroke-width="4">
    <rect x="30" y="40" width="110" height="90" fill="#4cc9f0"/>
    <line x1="85" y1="40" x2="85" y2="130"/>
    <line x1="30" y1="85" x2="140" y2="85"/>
  </g>

  <!-- desk -->
  <g stroke="#000" stroke-width="4">
    <rect x="160" y="270" width="420" height="22" fill="#ff7f11"/>
    <rect x="180" y="292" width="20" height="45" fill="#ff7f11"/>
    <rect x="540" y="292" width="20" height="45" fill="#ff7f11"/>
  </g>

  <!-- monitor -->
  <g stroke="#000" stroke-width="4">
    <rect x="270" y="40" width="300" height="200" rx="8" fill="#3a86ff"/>
    <rect x="285" y="55" width="270" height="170" fill="#fff"/>
    <rect x="405" y="240" width="30" height="20" fill="#3a86ff"/>
    <rect x="375" y="258" width="90" height="12" fill="#3a86ff"/>
  </g>
  <!-- simulator title bar -->
  <rect x="287" y="57" width="266" height="22" fill="#06d6a0"/>
  <text x="420" y="74" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Packet Tracer</text>

  <!-- two virtual PCs and a cable -->
  <g stroke="#000" stroke-width="3">
    <rect x="310" y="115" width="60" height="42" fill="#a9def9"/>
    <rect x="330" y="157" width="20" height="10" fill="#a9def9"/>
    <rect x="318" y="167" width="44" height="8" fill="#a9def9"/>
    <rect x="470" y="115" width="60" height="42" fill="#a9def9"/>
    <rect x="490" y="157" width="20" height="10" fill="#a9def9"/>
    <rect x="478" y="167" width="44" height="8" fill="#a9def9"/>
  </g>
  <line x1="372" y1="136" x2="468" y2="136" stroke="#000" stroke-width="3"/>
  <circle cx="380" cy="136" r="5" fill="#38b000" stroke="#000" stroke-width="2"/>
  <circle cx="460" cy="136" r="5" fill="#38b000" stroke="#000" stroke-width="2"/>
  <!-- packet envelope moving along the cable -->
  <g stroke="#000" stroke-width="2">
    <rect x="405" y="112" width="30" height="20" fill="#ffd60a"/>
    <path d="M405 112 L420 124 L435 112" fill="none"/>
  </g>
  <text x="340" y="198" font-size="13" fill="#000" text-anchor="middle">PC0</text>
  <text x="500" y="198" font-size="13" fill="#000" text-anchor="middle">PC1</text>

  <!-- Jax, seen from the side, sitting at the desk -->
  <g stroke="#000" stroke-width="4">
    <!-- chair -->
    <rect x="70" y="250" width="90" height="16" fill="#ef476f"/>
    <rect x="70" y="170" width="16" height="96" fill="#ef476f"/>
    <rect x="108" y="266" width="12" height="66" fill="#ef476f"/>
    <!-- legs -->
    <rect x="110" y="232" width="62" height="22" rx="8" fill="#1d4ed8"/>
    <rect x="150" y="232" width="22" height="95" fill="#1d4ed8"/>
    <ellipse cx="170" cy="332" rx="22" ry="9" fill="#fff"/>
    <!-- hoodie body -->
    <rect x="92" y="150" width="62" height="100" rx="14" fill="#f77f00"/>
    <!-- arm reaching to the keyboard -->
    <line x1="135" y1="190" x2="245" y2="245" stroke-width="30"/>
    <line x1="135" y1="190" x2="245" y2="245" stroke="#f77f00" stroke-width="22"/>
    <circle cx="252" cy="250" r="10" fill="#c68642"/>
    <!-- neck and head -->
    <rect x="114" y="132" width="18" height="20" fill="#c68642"/>
    <circle cx="126" cy="105" r="34" fill="#c68642"/>
    <!-- messy hair -->
    <path d="M92 100 Q90 65 126 67 Q165 65 161 100 Q153 83 143 91 Q135 77 123 89 Q111 77 103 93 Z" fill="#2b2118"/>
  </g>
  <!-- keyboard -->
  <rect x="235" y="258" width="110" height="12" fill="#fff" stroke="#000" stroke-width="3"/>
  <!-- face, looking at the screen -->
  <circle cx="146" cy="106" r="4" fill="#000"/>
  <path d="M140 122 Q150 128 158 120" fill="none" stroke="#000" stroke-width="3"/>
</svg>
