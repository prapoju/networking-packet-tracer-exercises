<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Comic Sans MS, Comic Neue, Chalkboard SE, cursive" stroke-linejoin="round" stroke-linecap="round">
  <!-- wall and cubicle walls -->
  <rect width="600" height="400" fill="#ffd23f"/>
  <rect x="20" y="40" width="560" height="250" fill="#3bceac" stroke="#000" stroke-width="5"/>
  <rect x="20" y="30" width="560" height="16" fill="#0ead69" stroke="#000" stroke-width="4"/>

  <g transform="translate(400 80)"><!-- company poster -->
  <rect x="40" y="62" width="150" height="70" fill="#fff" stroke="#000" stroke-width="3" transform="rotate(-3 115 97)"/>
  <text x="115" y="90" font-size="15" font-weight="bold" fill="#0057b8" text-anchor="middle" transform="rotate(-3 115 97)">COASTLINE</text>
  <text x="115" y="108" font-size="15" font-weight="bold" fill="#0057b8" text-anchor="middle" transform="rotate(-3 115 97)">TELECOM</text>
  <text x="115" y="124" font-size="11" fill="#000" text-anchor="middle" transform="rotate(-3 115 97)">Smile! They can hear it!</text></g>

  <!-- wall clock -->
  <circle cx="520" cy="95" r="34" fill="#ff006e" stroke="#000" stroke-width="4"/>
  <line x1="520" y1="95" x2="520" y2="70" stroke="#fff" stroke-width="4"/>
  <line x1="520" y1="95" x2="538" y2="104" stroke="#fff" stroke-width="4"/>


  <!-- Jax -->
  <g transform="translate(-71 24) scale(0.85)">
  <g stroke="#000" stroke-width="4">
    <rect x="176" y="300" width="22" height="55" fill="#1d4ed8"/>
    <rect x="204" y="300" width="22" height="55" fill="#1d4ed8"/>
    <ellipse cx="184" cy="360" rx="18" ry="9" fill="#fff"/>
    <ellipse cx="220" cy="360" rx="18" ry="9" fill="#fff"/>
