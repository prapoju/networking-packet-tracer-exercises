<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Comic Sans MS, Comic Neue, Chalkboard SE, cursive" stroke-linejoin="round" stroke-linecap="round">
  <!-- sky with clouds -->
  <rect width="600" height="400" fill="#90e0ef"/>
  <g fill="#e9ecef" stroke="#000" stroke-width="3">
    <ellipse cx="90" cy="60" rx="55" ry="22"/>
    <ellipse cx="130" cy="48" rx="35" ry="20"/>
    <ellipse cx="300" cy="40" rx="45" ry="18"/>
  </g>

  <!-- call center building -->
  <rect x="250" y="90" width="340" height="245" fill="#3a86ff" stroke="#000" stroke-width="5"/>
  <rect x="270" y="105" width="300" height="42" fill="#fff" stroke="#000" stroke-width="4"/>
  <text x="420" y="134" font-size="24" font-weight="bold" fill="#0057b8" text-anchor="middle">COASTLINE TELECOM</text>

  <!-- windows -->
  <g stroke="#000" stroke-width="4" fill="#ffd60a">
    <rect x="275" y="165" width="60" height="45"/>
    <rect x="355" y="165" width="60" height="45"/>
    <rect x="435" y="165" width="60" height="45"/>
    <rect x="515" y="165" width="60" height="45"/>
    <rect x="275" y="235" width="60" height="45"/>
    <rect x="515" y="235" width="60" height="45"/>
  </g>
  <!-- blinds down in one window -->
  <g stroke="#000" stroke-width="2">
    <line x1="435" y1="175" x2="495" y2="175"/><line x1="435" y1="185" x2="495" y2="185"/><line x1="435" y1="195" x2="495" y2="195"/><line x1="435" y1="205" x2="495" y2="205"/>
  </g>
  <!-- FOR LEASE sign -->
  <rect x="520" y="240" width="50" height="35" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="545" y="255" font-size="10" font-weight="bold" fill="#d00000" text-anchor="middle">FOR</text>
  <text x="545" y="269" font-size="10" font-weight="bold" fill="#d00000" text-anchor="middle">LEASE</text>

  <!-- glass door with CLOSED sign -->
  <rect x="380" y="235" width="90" height="100" fill="#bde0fe" stroke="#000" stroke-width="4"/>
  <line x1="425" y1="235" x2="425" y2="335" stroke="#000" stroke-width="3"/>
  <line x1="405" y1="245" x2="415" y2="258" stroke="#000" stroke-width="2"/>
  <line x1="445" y1="245" x2="435" y2="258" stroke="#000" stroke-width="2"/>
  <rect x="398" y="258" width="54" height="22" fill="#ff006e" stroke="#000" stroke-width="2"/>
  <text x="425" y="274" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">CLOSED</text>

  <!-- sidewalk -->
  <rect x="0" y="330" width="600" height="70" fill="#ff99c8" stroke="#000" stroke-width="4"/>
  <g stroke="#000" stroke-width="2">
    <line x1="100" y1="330" x2="100" y2="400"/><line x1="220" y1="330" x2="220" y2="400"/><line x1="340" y1="330" x2="340" y2="400"/><line x1="460" y1="330" x2="460" y2="400"/>
  </g>

  <!-- Jax, carrying a box -->
  <g transform="translate(-20 30) scale(0.85)">
    <g stroke="#000" stroke-width="4">
      <rect x="176" y="300" width="22" height="55" fill="#1d4ed8"/>
      <rect x="204" y="300" width="22" height="55" fill="#1d4ed8"/>
      <ellipse cx="184" cy="360" rx="18" ry="9" fill="#fff"/>
      <ellipse cx="220" cy="360" rx="18" ry="9" fill="#fff"/>
      <rect x="148" y="215" width="22" height="75" rx="10" fill="#f77f00"/>
      <rect x="232" y="215" width="22" height="75" rx="10" fill="#f77f00"/>
      <rect x="164" y="205" width="74" height="100" rx="14" fill="#f77f00"/>
      <rect x="192" y="190" width="18" height="18" fill="#c68642"/>
      <circle cx="201" cy="160" r="34" fill="#c68642"/>
      <path d="M167 155 Q165 120 201 122 Q240 120 236 155 Q228 138 218 146 Q210 132 198 144 Q186 132 178 148 Z" fill="#2b2118"/>
    </g>
    <circle cx="190" cy="162" r="4" fill="#000"/>
    <circle cx="213" cy="162" r="4" fill="#000"/>
    <path d="M190 183 L212 183" fill="none" stroke="#000" stroke-width="3"/>

    <!-- what's in the box: a mug, a dead plant, a phone charger -->
    <g stroke="#000" stroke-width="3">
      <rect x="180" y="226" width="16" height="24" fill="#ff006e"/>
      <line x1="215" y1="250" x2="212" y2="212" stroke="#8d6e63" stroke-width="4"/>
      <path d="M212 222 Q200 226 198 236" fill="none" stroke="#8d6e63" stroke-width="3"/>
      <path d="M213 216 Q226 220 228 232" fill="none" stroke="#8d6e63" stroke-width="3"/>
      <path d="M226 250 Q236 228 222 222" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- the box -->
    <rect x="160" y="245" width="82" height="58" fill="#f4d58d" stroke="#000" stroke-width="4"/>
    <text x="201" y="280" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">PRINTER</text>
    <text x="201" y="293" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">PAPER</text>
    <!-- hands on the box -->
    <circle cx="160" cy="275" r="10" fill="#c68642" stroke="#000" stroke-width="4"/>
    <circle cx="242" cy="275" r="10" fill="#c68642" stroke="#000" stroke-width="4"/>
  </g>
</svg>
