<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="617px" preserveAspectRatio="none" style="width:528px;height:617px;background:#FFFFFF;" version="1.1" viewBox="0 0 528 617" width="528px" zoomAndPan="magnify"><defs/><g><!--entity P1--><g class="entity" data-qualified-name="P1" data-source-line="11" id="ent0002"><rect fill="#FFFFFF" height="77.2038" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="191.2053" x="7" y="7"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="171.2053" x="17" y="31.9659">Ivy can send packets to all</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="161.7414" x="17" y="51.0339">of the IPs that are within</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="76.9437" x="17" y="70.1018">his network</text></g><!--entity P2--><g class="entity" data-qualified-name="P2" data-source-line="12" id="ent0003"><rect fill="#FFFFFF" height="58.1358" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="152.8735" x="233.17" y="16.53"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="132.8735" x="243.17" y="41.4959">Theo's IP belongs to</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="86.8277" x="243.17" y="60.5639">Ivy's network</text></g><!--entity J1--><g class="entity" data-qualified-name="J1" data-source-line="13" id="ent0004"><ellipse cx="205.6" cy="162.2" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/></g><!--entity C1--><g class="entity" data-qualified-name="C1" data-source-line="14" id="ent0005"><rect fill="#E8F1FF" height="39.0679" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="213.7172" x="98.74" y="240.2"/><text fill="#000000" font-family="Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="193.7172" x="108.74" y="265.1659">Ivy can send a packet to Theo</text></g><!--entity P3--><g class="entity" data-qualified-name="P3" data-source-line="21" id="ent0009"><rect fill="#FFFFFF" height="77.2038" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="194.4953" x="108.36" y="339.27"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="174.4953" x="118.36" y="364.2359">Theo can't send packets to</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="154.4054" x="118.36" y="383.3039">IPs that don't belong to</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="76.9437" x="118.36" y="402.3718">his network</text></g><!--entity P4--><g class="entity" data-qualified-name="P4" data-source-line="22" id="ent0010"><rect fill="#FFFFFF" height="58.1358" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="184.5414" x="338.33" y="348.8"/><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="164.5414" x="348.33" y="373.7659">Ivy's IP doesn't belong to</text><text fill="#000000" font-family="Sans" font-size="14" lengthAdjust="spacing" textLength="100.6316" x="348.33" y="392.8339">Theo's network</text></g><!--entity J2--><g class="entity" data-qualified-name="J2" data-source-line="23" id="ent0011"><ellipse cx="317.6" cy="494.47" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/></g><!--entity C2--><g class="entity" data-qualified-name="C2" data-source-line="24" id="ent0012"><rect fill="#FFECEC" height="39.0679" rx="6" ry="6" style="stroke:#444444;stroke-width:0.5;" width="221.9212" x="206.64" y="572.47"/><text fill="#000000" font-family="Sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="201.9212" x="216.64" y="597.4359">Theo can't send a packet to Ivy</text></g><!--link P1 to J1--><g class="link" dat